name: Build, Push and Deploy Docker Image
run-name: Build, Push and Deploy Docker Image
on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: "${{ secret.USER_DOCKER }}/2048-fantaofan"
  DOCKER_USER: "${{ secret.USER_DOCKER }}"

jobs:
  build-push-image:
  steps:
    - name: Check out repository code
      uses: action/checkou@v4
    - name: Build Image
      run: docker build -t $IMAGE_NAME .
    - name: List Image
      run: docker image
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secret.USER_DOCKER }}
        password: ${{ secret.PASSWORD_DOCKER }}
    - name: Push Image
      run: docker push $IMAGE_NAME

  deploy-2048:
    needs: build-push-image
    ron-on: self-hosted
    steps:
      - name: Check out repository code
        uses: action/checkout@v4
      - name:  stop and remove existing container
        run: docker compose down --rmi all
      - name: start container
        run: docker compose up -d



